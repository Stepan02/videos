version: "3.8"

services:
  cache:
    image: redis:latest
    container_name: cache
    hostname: cache
    ports:
      - "6379:6379"
    command: redis-server --requirepass password
    volumes:
      - cache_data:/data

  mongodb:
    image: mongo:latest
    container_name: database
    ports:
      - "27017:27017"
    volumes:
      - database_data:/data/db

volumes:
  cache_data:
  database_data: